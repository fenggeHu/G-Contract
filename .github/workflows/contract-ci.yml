name: contract-ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          ok=True
          for p in pathlib.Path('shared').rglob('*.json'):
              try: json.loads(p.read_text())
              except Exception as e: print("invalid:",p,e); ok=False
          sys.exit(0 if ok else 1)
          PY
      - name: No private references
        run: |
          if grep -rnE "\.\./(architecture|iterations|product|processes)/|\.\./\.\./CHANGELOG" docs shared; then
            echo "Found references to private documents"; exit 1
          fi
  mirror-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Read-only mirror guard (no direct edits to mirrored files)
        run: |
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD || true)"
          if echo "$changed" | grep -qE '^(shared/|docs/contracts/|LICENSE$|README\.md$|SECURITY\.md$|CONTRIBUTING\.md$|\.github/)'; then
            echo "This repository is a read-only mirror generated by the platform; do not edit contracts/docs/templates directly."
            echo "Please open an issue instead (bug / capability-request / content-handoff); the platform will evaluate and publish."
            echo "Changed files:"; echo "$changed" | grep -E '^(shared/|docs/contracts/|LICENSE$|README\.md$|SECURITY\.md$|CONTRIBUTING\.md$|\.github/)'
            exit 1
          fi
