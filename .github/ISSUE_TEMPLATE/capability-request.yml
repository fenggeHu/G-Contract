name: Capability Request
description: Request a new generic engine capability, a version relaxation, or a contract change
title: "[capability] "
labels: ["capability"]
body:
  - type: textarea
    id: need
    attributes:
      label: Requirement
      description: What gameplay/content you want to build, and why the current capabilities are insufficient.
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Proposed capability name and version
      placeholder: "e.g. region.trigger@1.0"
    validations:
      required: true
  - type: textarea
    id: generality
    attributes:
      label: Generality
      description: Must be reusable by at least 2 content packs ("needed in only one place" is a design smell).
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - New capability
        - enabled/deferred status change
        - Schema field added/changed
        - Protocol message change
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Expected time / milestone