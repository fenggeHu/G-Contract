name: Bug / Contract ambiguity
description: Problems in contract text, Schema, examples, or protocol/model artifacts
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Symptom and expectation
      description: What you observed, what you expected, and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Contract snippet / command output / links
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Contract version / commit