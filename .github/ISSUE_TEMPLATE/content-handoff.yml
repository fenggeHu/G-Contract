name: Content Handoff
description: Handoff request or open question between the platform and content teams
title: "[handoff] "
labels: ["handoff"]
body:
  - type: textarea
    id: need
    attributes:
      label: Requirement / open question
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: What the other side needs to do
      description: Request only; scope and schedule are decided by the respective team.
    validations:
      required: true
  - type: input
    id: interface
    attributes:
      label: Interface / contract artifact
  - type: input
    id: deadline
    attributes:
      label: Expected time / milestone